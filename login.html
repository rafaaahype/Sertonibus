<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertonibus - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="sertonibus-auth-page">
    <main class="sertonibus-auth-shell">
        <section class="sertonibus-auth-card" aria-label="Acesso ao Sertonibus">
            <div class="sertonibus-auth-brand">
                <div class="sertonibus-auth-mark">S</div>
                <div>
                    <span class="sertonibus-auth-kicker">SERTONIBUS</span>
                    <p>Transporte universitário</p>
                </div>
            </div>

            <div class="sertonibus-auth-heading">
                <span class="sertonibus-auth-eyebrow">Área segura</span>
                <h1>Acessar conta</h1>
                <p>Entre com seus dados para continuar.</p>
            </div>

            <form id="form-login" class="sertonibus-auth-form">
                <div class="sertonibus-auth-field">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" required autocomplete="username" placeholder="Digite seu usuário">
                </div>

                <div class="sertonibus-auth-field">
                    <label for="password">Senha</label>
                    <div class="sertonibus-password-wrap">
                        <input type="password" id="password" required autocomplete="current-password" placeholder="Digite sua senha">
                        <button type="button" class="sertonibus-password-toggle" data-password-toggle="password" aria-label="Mostrar senha" aria-pressed="false">👁</button>
                    </div>
                </div>

                <button type="submit" class="sertonibus-auth-submit">
                    <span class="sertonibus-submit-label">Entrar</span>
                    <span class="sertonibus-submit-loading" aria-hidden="true">
                        <span class="sertonibus-spinner"></span>
                        Entrando...
                    </span>
                </button>
            </form>

            <div class="sertonibus-auth-footer">
                <span>Primeiro acesso?</span>
                <a href="register.html">Criar uma conta</a>
            </div>
            <a href="index.html" class="sertonibus-auth-back">Voltar ao menu</a>
        </section>
    </main>

    <script src="js/database.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
