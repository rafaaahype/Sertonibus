<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertonibus - Área do Estudante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 text-white p-4 shadow">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">🚌 Sertonibus 🌵 | Estudante</h1>
            <div class="text-sm font-medium">
                <span id="user-display" class="mr-4"></span>
                <button id="btn-logout" class="underline hover:text-blue-200">Sair</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-lg shadow border-t-4 border-green-500">
            <h2 class="text-2xl font-bold mb-2">Agendar Viagem</h2>
            <p class="text-gray-600 mb-4 text-sm">Selecione o dia e horário que você precisa ir estudar e informe onde o ônibus deve te buscar.</p>
            <form id="form-booking" class="flex flex-col gap-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium mb-1">Dia da Semana</label>
                        <select id="day" class="w-full border rounded p-2 outline-none">
                            <option value="Segunda-feira">Segunda-feira</option>
                            <option value="Terça-feira">Terça-feira</option>
                            <option value="Quarta-feira">Quarta-feira</option>
                            <option value="Quinta-feira">Quinta-feira</option>
                            <option value="Sexta-feira">Sexta-feira</option>
                        </select>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium mb-1">Horário</label>
                        <select id="time" class="w-full border rounded p-2 outline-none">
                            <option value="Manhã (07:00)">Manhã (07:00)</option>
                            <option value="Tarde (13:00)">Tarde (13:00)</option>
                            <option value="Noite (18:30)">Noite (18:30)</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium mb-1" for="addr-street">Rua e número</label>
                        <input type="text" id="addr-street" required maxlength="120" placeholder="Ex.: Rua Projetada, 123" class="w-full border rounded p-2 outline-none">
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium mb-1" for="addr-neighborhood">Bairro</label>
                        <input type="text" id="addr-neighborhood" required maxlength="80" placeholder="Ex.: Centro" class="w-full border rounded p-2 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1" for="addr-reference">Ponto de referência <span class="text-gray-400 font-normal">(opcional)</span></label>
                    <input type="text" id="addr-reference" maxlength="120" placeholder="Ex.: Em frente à padaria" class="w-full border rounded p-2 outline-none">
                </div>

                <button type="submit" class="bg-green-600 text-white font-bold py-2 px-6 rounded hover:bg-green-700 w-full md:w-auto md:self-end">Confirmar Vaga</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-xl font-bold mb-4">Meus Agendamentos</h3>
            <ul id="my-bookings-list" class="space-y-2">
                <!-- As viagens agendadas aparecerão aqui via JavaScript -->
            </ul>
        </div>
    </main>

    <script src="js/database.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
